[project]
name = "dora-tools"
version = "0.1.0"
description = "The DORA metrics of a team's delivery, from its code host and Jira: checking a project has what they need."
requires-python = ">=3.13"
dependencies = ["cli-kit", "repo-settings", "repo-tools", "jira-tools"]

[project.scripts]
dora = "dora.__main__:main"

[tool.uv.sources]
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", tag = "v0.1.0" }
repo-settings = { git = "https://github.com/ianflanagan1/repo-settings", tag = "v0.1.0" }
repo-tools = { git = "https://github.com/ianflanagan1/repo-tools", tag = "v0.1.0" }
jira-tools = { git = "https://github.com/ianflanagan1/jira-tools", tag = "v0.1.0" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dora"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
