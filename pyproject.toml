[project]
name = "dora-tools"
version = "0.1.0"
description = "The DORA metrics of a team's delivery, from its code host and Jira: checking a project has what they need."
requires-python = ">=3.13"
dependencies = ["cli-kit", "repo-tools", "jira-tools"]

[project.scripts]
dora = "dora.__main__:main"

[tool.uv.sources]
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", branch = "main" }
# The sibling checkouts, until repo-tools and jira-tools publish what dora needs.
repo-tools = { path = "../repo-tools", editable = true }
jira-tools = { path = "../jira-tools", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dora"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
